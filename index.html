<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16794a">
<title>ePASHU — Test Better. Feed Smarter. Farm Better.</title>
<style>
:root{
  --green:#16794a;--green2:#25a866;--mint:#eaf8ef;--earth:#8b6848;--cream:#fbfaf5;
  --ink:#183027;--muted:#66756f;--line:#dfe9e3;--yellow:#e7a51a;--red:#d9534f;
  --card:#fff;--shadow:0 12px 35px rgba(24,48,39,.08);--radius:20px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink)}
button,input,select{font:inherit} button{cursor:pointer;border:0}
.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--green)}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#16794a,#56c985);display:grid;place-items:center;color:white;font-size:21px;box-shadow:0 8px 18px rgba(22,121,74,.22)}
.top-actions{display:flex;align-items:center;gap:8px}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:12px}.online{color:var(--green);background:var(--mint)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:68px;height:calc(100vh - 68px)}
.nav{display:grid;gap:7px}.nav button{background:transparent;color:#53635c;text-align:left;padding:12px 13px;border-radius:13px;font-weight:750;display:flex;align-items:center;gap:11px}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green)}
.side-note{margin-top:25px;padding:13px;border-radius:16px;background:#f5f2e9;font-size:12px;line-height:1.5;color:#75664f}
.main{padding:28px;max-width:1400px;width:100%;margin:auto}.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#123e2b,#16794a 62%,#35b66e);color:#fff;border-radius:28px;padding:34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:rgba(255,255,255,.09)}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.02;margin:0 0 13px;max-width:720px}.hero p{font-size:17px;opacity:.9;max-width:700px;line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{padding:12px 17px;border-radius:13px;font-weight:850;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px)}.primary{background:#fff;color:var(--green)}.green{background:var(--green);color:#fff}.soft{background:var(--mint);color:var(--green)}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0ef;color:#b43b38}
.demo{display:inline-block;margin-top:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:28px 0 13px}.section-title h2{margin:0;font-size:22px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}.features{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:0 5px 20px rgba(24,48,39,.035)}.feature-icon{font-size:27px;margin-bottom:12px}.card h3{margin:0 0 7px}.card p{color:var(--muted);line-height:1.5;font-size:13px;margin:0}
.stat strong{font-size:29px;display:block;margin-top:5px}.stat span{color:var(--muted);font-size:12px}.stat small{font-size:10px;color:#8d7b60}
.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.step{position:relative;text-align:center;padding:18px 8px}.step .num{margin:auto;width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:900}.step:not(:last-child):after{content:"→";position:absolute;right:-10px;top:29px;color:#9cb4a7;font-weight:900}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#72bd95;box-shadow:0 0 0 3px #eaf8ef}
.stepper{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.stepper span{white-space:nowrap;padding:8px 11px;border-radius:999px;background:#f1f5f2;color:#77837e;font-size:11px;font-weight:800}.stepper span.on{background:var(--green);color:#fff}
.upload{border:2px dashed #b9d5c4;border-radius:17px;padding:24px;text-align:center;background:#f8fcf9}.upload input{margin-top:10px}.preview{max-width:180px;max-height:130px;border-radius:13px;margin:12px auto 0;display:none}
.notice{padding:12px 14px;border-radius:13px;background:#f7f5ee;color:#6f624d;font-size:12px;line-height:1.5}.success{background:#eaf8ef;color:#17643f}.warn{background:#fff8df;color:#7a5c13}.risk{display:flex;align-items:center;gap:8px;font-weight:850}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.low{background:#2da866}.med{background:#e6a51b}.high{background:#d9534f}
.result-score{display:flex;align-items:center;gap:18px}.score-ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 84%,#e8eee9 0);position:relative}.score-ring:after{content:"";width:78px;height:78px;background:#fff;border-radius:50%;position:absolute}.score-ring b{position:relative;z-index:1;font-size:24px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:13px;background:#f8fbf9;border-radius:13px}.metric b{display:block;font-size:17px}.metric span{font-size:11px;color:var(--muted)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.good{background:#e5f7ec;color:#187143}.attention{background:#fff5d8;color:#80610e}.highrisk{background:#ffe9e7;color:#ad3935}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{padding:8px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800}.filters button.on{background:var(--green);color:#fff}
.advice-icon{font-size:25px}.list{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.8}
.admin-card{min-height:300px}.bars{height:190px;display:flex;align-items:end;gap:10px;padding:15px 4px 0}.bar{flex:1;background:linear-gradient(#2fae6b,#8bd3a8);border-radius:7px 7px 0 0;min-width:18px}.legend{font-size:10px;color:var(--muted);text-align:center;margin-top:5px}
.map{height:230px;border-radius:17px;background:linear-gradient(135deg,#e7f2e9,#f5ecd9);position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:25px;border:2px dashed #a4bea9;border-radius:45% 55% 52% 48%;transform:rotate(-8deg)}.pin{position:absolute;font-size:21px}.p1{left:25%;top:40%}.p2{left:56%;top:55%}.p3{left:72%;top:28%}
.empty{text-align:center;padding:40px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#173d2d;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);display:none;z-index:50;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(12,30,23,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal.show{display:flex}.modal-box{width:min(520px,100%);background:#fff;border-radius:22px;padding:23px;max-height:90vh;overflow:auto}.close{float:right;background:#f0f3f1;border-radius:50%;width:32px;height:32px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#e8f8ed,#f8f6ed 55%,#fff)}.auth-box{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.auth-logo{text-align:center;margin-bottom:20px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f5f3;border-radius:12px;padding:4px;margin-bottom:18px}.auth-tabs button{padding:10px;border-radius:9px;background:transparent;font-weight:800}.auth-tabs .sel{background:#fff;box-shadow:0 3px 10px #dce5df}
.mobile-nav{display:none}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{background:none;font-size:10px;color:#617068;font-weight:800}.mobile-nav button span{display:block;font-size:19px}.main{padding:18px 14px 80px}.features,.stats{grid-template-columns:repeat(2,1fr)}.workflow{grid-template-columns:1fr 1fr}.step:not(:last-child):after{display:none}}
@media(max-width:600px){.topbar{padding:0 13px}.top-actions .userpill{display:none}.hero{padding:25px 20px;border-radius:21px}.hero h1{font-size:33px}.features,.stats,.two,.three,.form-grid,.metric-grid{grid-template-columns:1fr}.result-score{align-items:flex-start}.section-title{align-items:flex-start;flex-direction:column}.workflow{grid-template-columns:1fr}.step{display:flex;gap:10px;text-align:left;align-items:center}.step .num{margin:0;min-width:42px}.brand{font-size:17px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="reportModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal()">×</button>
  <div id="reportContent"></div>
  <div class="actions"><button class="btn green" onclick="printReport()">🖨 Print</button><button class="btn outline" onclick="closeModal()">Close</button></div>
 </div>
</div>

<script>
/* FeedCare AI — standalone prototype
   REAL INTEGRATION POINTS:
   - Replace analyzeFeed/analyzeSilage mock functions with fetch('/api/analyze-feed/') and fetch('/api/analyze-silage/')
   - Add secure Django/DRF authentication; never store passwords in localStorage in production.
   - Replace demo device connection with Web Bluetooth/native bridge.
   - Replace localStorage sync with a real authenticated sync queue.
*/
const T={
 en:{
  home:"Home",feed:"Test Feed",silage:"Test Silage",reports:"Reports",advisory:"Advisory",history:"History",profile:"Profile",
 hero:"Smart Feed & Silage Quality Analysis",sub:"Rapid, affordable and digital feed-quality assessment for dairy farmers.",
 testFeed:"Test Feed",testSilage:"Test Silage",ai:"AI-Powered Analysis",portable:"Portable Testing",farmer:"Farmer-Friendly Advisory",
 workflow:"How it works",stats:"Prototype dashboard",demo:"Prototype / Demo Data",tests:"Tests Completed",farmers:"Farmers Supported",samples:"Samples Analyzed",warnings:"Warnings Detected",
 sample:"Sample",sensors:"Sensors/Camera",analysis:"AI Analysis",result:"Quality Result",adv:"Advisory",
 connect:"Connect Testing Device",start:"START ANALYSIS",save:"Save Result",another:"Test Another Sample",download:"Download Report",
 good:"GOOD",attention:"ATTENTION",high:"HIGH RISK",offline:"Offline Mode",sync:"Pending Sync",online:"Online • Synced"
 },
 hi:{
  home:"होम",feed:"फीड टेस्ट",silage:"साइलेज टेस्ट",reports:"रिपोर्ट",advisory:"सलाह",history:"इतिहास",profile:"प्रोफ़ाइल",
  hero:"स्मार्ट फीड और साइलेज गुणवत्ता विश्लेषण",sub:"डेयरी किसानों के लिए तेज़, किफायती और डिजिटल चारा गुणवत्ता जांच।",
  testFeed:"फीड टेस्ट करें",testSilage:"साइलेज टेस्ट करें",ai:"AI आधारित विश्लेषण",portable:"पोर्टेबल टेस्टिंग",farmer:"किसान-अनुकूल सलाह",
  workflow:"यह कैसे काम करता है",stats:"प्रोटोटाइप डैशबोर्ड",demo:"प्रोटोटाइप / डेमो डेटा",tests:"कुल टेस्ट",farmers:"किसान",samples:"सैंपल",warnings:"चेतावनियां",
  sample:"सैंपल",sensors:"सेंसर/कैमरा",analysis:"AI विश्लेषण",result:"गुणवत्ता परिणाम",adv:"सलाह",
  connect:"टेस्टिंग डिवाइस कनेक्ट करें",start:"विश्लेषण शुरू करें",save:"परिणाम सेव करें",another:"दूसरा सैंपल टेस्ट करें",download:"रिपोर्ट डाउनलोड करें",
  good:"अच्छा",attention:"ध्यान दें",high:"उच्च जोखिम",offline:"ऑफलाइन मोड",sync:"सिंक लंबित",online:"ऑनलाइन • सिंक"
 }};
let state={lang:localStorage.getItem("fc_lang")||"en", user:JSON.parse(localStorage.getItem("fc_user")||"null"), view:"home", testType:null, tests:JSON.parse(localStorage.getItem("fc_tests")||"[]"), current:null, connected:false, authMode:"login", filter:"All", online:navigator.onLine};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function tr(k){return (T[state.lang]||T.en)[k]||k}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(msg){let x=$("#toast");x.textContent=msg;x.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display="none",2600)}
function save(){localStorage.setItem("fc_tests",JSON.stringify(state.tests));localStorage.setItem("fc_lang",state.lang);if(state.user)localStorage.setItem("fc_user",JSON.stringify(state.user))}
function nav(view){state.view=view;render()}
function shell(content){
return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">🌿</div>FeedCare AI</div>
<div class="top-actions"><button class="pill" onclick="toggleLang()">🌐 ${state.lang==="en"?"हिन्दी":"English"}</button><span class="pill online" id="netpill">${state.online?"● Online • Synced":"● Offline Mode"}</span><button class="pill userpill" onclick="nav('profile')">👤 ${esc(state.user?.name||"Farmer")}</button></div></header>
<div class="layout"><aside class="sidebar"><nav class="nav">
${navBtn("home","🏠",tr("home"))}${navBtn("feed","🌽",tr("feed"))}${navBtn("silage","🌱",tr("silage"))}${navBtn("reports","📄",tr("reports"))}${navBtn("advisory","💡",tr("advisory"))}${navBtn("history","🕘",tr("history"))}${navBtn("profile","👤",tr("profile"))}<button onclick="nav('admin')">📊 Admin Dashboard</button></nav><div class="side-note"><b>${state.online?"🟢 Online • Synced":"🟠 Offline Mode"}</b><br><span id="syncText">${state.online?"Data is ready to sync with the backend.":"Tests can be saved locally and marked Pending Sync."}</span></div></aside><main class="main">${content}</main></div>
<nav class="mobile-nav">${navBtnMobile("home","🏠",tr("home"))}${navBtnMobile("feed","🌽",tr("feed"))}${navBtnMobile("silage","🌱",tr("silage"))}${navBtnMobile("history","🕘",tr("history"))}${navBtnMobile("profile","👤",tr("profile"))}</nav></div>`
}
function navBtn(v,icon,label){return `<button class="${state.view===v?"active":""}" onclick="nav('${v}')">${icon} ${label}</button>`}
function navBtnMobile(v,icon,label){return `<button onclick="nav('${v}')"><span>${icon}</span>${label}</button>`}
function render(){if(!state.user){renderAuth();return} $("#root").innerHTML=shell(viewContent());setTimeout(()=>bindPage(),0)}
function renderAuth(){ $("#root").innerHTML=`<div class="auth"><div class="auth-box">
<div class="auth-logo"><div class="logo" style="margin:auto">🌿</div><h1>ePASHU</h1><p class="muted">Test Better. Feed Smarter. Farm Better.</p></div>
<div class="auth-tabs"><button class="${state.authMode==="login"?"sel":""}" onclick="state.authMode='login';renderAuth()">Login</button><button class="${state.authMode==="register"?"sel":""}" onclick="state.authMode='register';renderAuth()">Register</button></div>
${state.authMode==="login"?loginForm():registerForm()}
<div class="notice" style="margin-top:14px">🔐 <b>Demo OTP mode:</b> no SMS is sent. Use <b>123456</b> for prototype verification. Connect a real SMS/OTP provider before production.</div>
</div></div>`}
function loginForm(){return `<form onsubmit="demoLogin(event)"><div class="field"><label>Mobile Number</label><input id="loginMobile" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile"></div><div class="field" style="margin-top:12px"><label>OTP</label><input id="loginOtp" required inputmode="numeric" maxlength="6" placeholder="Demo OTP: 123456"></div><button class="btn green" style="width:100%;margin-top:16px">Login & Verify</button></form>`}
function registerForm(){return `<form onsubmit="demoRegister(event)"><div class="form-grid"><div class="field"><label>Farmer name</label><input id="rname" required></div><div class="field"><label>Mobile number</label><input id="rmobile" required inputmode="numeric" pattern="[0-9]{10}"></div><div class="field"><label>Village</label><input id="rvillage" required></div><div class="field"><label>District</label><input id="rdistrict" required></div><div class="field"><label>State</label><input id="rstate" value="Uttarakhand" required></div><div class="field"><label>Preferred language</label><select id="rlang"><option value="en">English</option><option value="hi">Hindi</option></select></div></div><div class="field" style="margin-top:12px"><label>OTP verification</label><input id="rotp" required maxlength="6" placeholder="Demo OTP: 123456"></div><button class="btn green" style="width:100%;margin-top:16px">Create Demo Account</button></form>`}
function demoLogin(e){e.preventDefault();if($("#loginOtp").value!=="123456")return toast("Use demo OTP 123456");state.user={name:"Demo Farmer",mobile:$("#loginMobile").value,village:"Demo Village",district:"Haridwar",state:"Uttarakhand",language:state.lang};save();toast("Login successful");render()}
function demoRegister(e){e.preventDefault();if($("#rotp").value!=="123456")return toast("Use demo OTP 123456");state.user={name:$("#rname").value,mobile:$("#rmobile").value,village:$("#rvillage").value,district:$("#rdistrict").value,state:$("#rstate").value,language:$("#rlang").value};state.lang=state.user.language;save();toast("Registration successful");render()}
function toggleLang(){state.lang=state.lang==="en"?"hi":"en";if(state.user)state.user.language=state.lang;save();render()}
function viewContent(){
switch(state.view){
case"home":return homeView();case"feed":return testView("feed");case"silage":return testView("silage");case"reports":return reportsView();case"advisory":return advisoryView();case"history":return historyView();case"profile":return profileView();case"admin":return adminView();default:return homeView()}}
function homeView(){return `<section class="hero"><div class="demo">SIH PROTOTYPE • AI ESTIMATED VALUES</div><h1>${tr("hero")}</h1><p>${tr("sub")}</p><div class="actions"><button class="btn primary" onclick="nav('feed')">🌽 ${tr("testFeed")}</button><button class="btn primary" onclick="nav('silage')">🌱 ${tr("testSilage")}</button></div></section>
<div class="section-title"><h2>${tr("features")||"Built for practical field testing"}</h2><span class="muted">Simple • Fast • Advisory-first</span></div><div class="grid features">
${feature("🤖",tr("ai"),"Analyze available image and sensor inputs with a modular AI/ML layer.")}
${feature("📡",tr("portable"),"Designed around portable testing devices, sensors and smartphone camera input.")}
${feature("👨‍🌾",tr("farmer"),"Clear quality indicators, risks and simple next-step recommendations.")}
</div>
<div class="section-title"><h2>${tr("workflow")}</h2></div><div class="card workflow">${["sample","sensors","analysis","result","adv"].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${tr(x)}</b><div class="muted">${["Collect","Measure","Predict","Understand","Act"][i]}</div></div></div>`).join("")}</div>
<div class="section-title"><h2>${tr("stats")}</h2><span class="muted">${tr("demo")}</span></div><div class="grid stats">${stat("48",tr("tests"))}${stat("31",tr("farmers"))}${stat("62",tr("samples"))}${stat("9",tr("warnings"))}</div>`}
function feature(i,t,p){return `<div class="card"><div class="feature-icon">${i}</div><h3>${t}</h3><p>${p}</p></div>`}
function stat(n,t){return `<div class="card stat"><span>${t}</span><strong>${n}</strong><small>Prototype / Demo</small></div>`}
function testView(type){
let isFeed=type==="feed", c=state.current;
if(c && c.type===type && c.phase==="result") return resultView(c);
return `<div class="section-title"><div><h2>${isFeed?"🌽 "+tr("feed"):"🌱 "+tr("silage")}</h2><span class="muted">Guided ${isFeed?"feed":"silage"} quality assessment</span></div><button class="btn outline" onclick="nav('home')">← ${tr("home")}</button></div>
<div class="stepper"><span class="on">1. Sample</span><span class="on">2. Input</span><span>3. Analysis</span><span>4. Result</span></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h3>① ${isFeed?"Feed":"Silage"} details</h3><div class="form-grid">
<div class="field"><label>${isFeed?"Feed":"Silage"} type</label><select id="sampleType">${(isFeed?["Maize","Wheat","Cattle Feed","Fodder","Other"]:["Maize Silage","Grass Silage","Mixed Silage","Other"]).map(x=>`<option>${x}</option>`).join("")}</select></div>
<div class="field"><label>Sample ID</label><input id="sampleId" value="${makeId()}" readonly></div>
${isFeed?`<div class="field"><label>Moisture (%)</label><input id="moisture" type="number" min="0" max="100" value="28"></div><div class="field"><label>Temperature (°C)</label><input id="temp" type="number" value="27"></div><div class="field"><label>pH</label><input id="ph" type="number" step=".1" value="6.0"></div>`:`<div class="field"><label>pH</label><input id="ph" type="number" step=".1" value="4.2"></div><div class="field"><label>Moisture (%)</label><input id="moisture" type="number" min="0" max="100" value="64"></div><div class="field"><label>Temperature (°C)</label><input id="temp" type="number" value="27"></div><div class="field"><label>Storage duration (days)</label><input id="duration" type="number" value="21"></div>`}
</div></div>
<div class="card"><h3>② Sample image</h3><div class="upload"><div style="font-size:30px">📷</div><b>Capture or upload sample image</b><p class="muted">Use your device camera or choose an existing JPG, PNG or WEBP image.</p><div class="actions" style="justify-content:center"><button type="button" class="btn green" onclick="openCamera()">📸 Take Photo</button><label class="btn outline" style="cursor:pointer">🖼 Upload Image<input id="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" onchange="previewImage(event)" style="display:none"></label></div><div id="cameraBox" style="display:none;margin-top:14px"><video id="cameraVideo" autoplay playsinline style="width:100%;max-height:280px;object-fit:cover;border-radius:15px;background:#10261c"></video><canvas id="cameraCanvas" style="display:none"></canvas><div class="actions" style="justify-content:center"><button type="button" class="btn green" onclick="capturePhoto()">● Capture</button><button type="button" class="btn outline" onclick="closeCamera()">Close Camera</button></div></div><img id="preview" class="preview"><div id="photoStatus" class="muted" style="margin-top:8px"></div></div></div></div>
<div class="card" style="margin-top:14px"><h3>③ ${tr("connect")}</h3><p class="muted">Bluetooth/device integration point. For this prototype, values can be entered manually.</p><div class="actions"><button class="btn soft" onclick="connectDevice()">📡 ${state.connected?"Device Connected":"Connect Demo Device"}</button><span class="pill">${state.connected?"🟢 Connected":"⚪ Not connected"}</span></div><div class="notice" style="margin-top:12px">⚠ <b>Demo Sensor Input:</b> manually entered moisture, temperature and pH are simulated/prototype inputs, not certified laboratory measurements.</div>
<div class="actions"><button class="btn green" onclick="startAnalysis('${type}')">⚡ ${tr("start")}</button></div></div>`}
function makeId(){return "FC-"+(1000+Math.floor(Math.random()*8999))}
let cameraStream=null;
function previewImage(e){let f=e.target.files[0],img=$("#preview");if(!f)return;if(f.size>5*1024*1024){toast("Image must be under 5 MB");e.target.value="";return}if(cameraStream)closeCamera();img.src=URL.createObjectURL(f);img.style.display="block";if($("#photoStatus"))$("#photoStatus").textContent="Image selected successfully."}
async function openCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Camera is not supported here. Run FeedCare using START_FEEDCARE.bat in Chrome/Edge.");return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});const video=$("#cameraVideo");video.srcObject=cameraStream;$("#cameraBox").style.display="block";$("#photoStatus").textContent="Camera ready. Position the sample and capture."}catch(err){toast("Camera permission was denied or the camera is unavailable.")}}
function capturePhoto(){const video=$("#cameraVideo"),canvas=$("#cameraCanvas"),img=$("#preview");if(!cameraStream||!video.videoWidth)return toast("Camera is not ready yet.");canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);img.src=canvas.toDataURL("image/jpeg",0.9);img.style.display="block";$("#photoStatus").textContent="Photo captured successfully.";closeCamera(false)}
function closeCamera(updateStatus=true){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const video=$("#cameraVideo");if(video)video.srcObject=null;const box=$("#cameraBox");if(box)box.style.display="none";if(updateStatus&&$("#photoStatus"))$("#photoStatus").textContent=""}
function connectDevice(){state.connected=true;toast("Demo testing device connected");render()}
async function startAnalysis(type){
let moisture=Number($("#moisture").value),temp=Number($("#temp").value),ph=Number($("#ph").value);
if(!Number.isFinite(moisture)||moisture<0||moisture>100)return toast("Enter a valid moisture value");
state.current={type,phase:"loading",sampleId:$("#sampleId").value,sampleType:$("#sampleType").value,moisture,temp,ph,duration:Number($("#duration")?.value||0),image:$("#preview")?.src||null};
render();
setTimeout(()=>{state.current={...state.current,phase:"result",result:type==="feed"?mockFeed(state.current):mockSilage(state.current)};render()},1600)
}
function mockFeed(c){
let score=Math.max(45,Math.min(96,Math.round(91-Math.abs(c.moisture-26)*1.7-Math.abs(c.temp-25)*.4)));
let status=score>=75?"Good":score>=55?"Attention":"High Risk";
return {score,status,metrics:[["Moisture",c.moisture+"%","Input"],["Protein","14.5%","AI Estimated"],["Fiber","18.2%","AI Estimated"],["Energy","8.9 MJ/kg","AI Estimated"],["Mould Risk",c.moisture>35?"Medium":"Low","AI Predicted"],["Adulteration Risk","Low","AI Predicted"]],advisory:score>=75?"Based on the available measurements, the feed appears suitable. Store the feed in a dry, clean and protected environment.":"Review storage conditions and consider confirmatory laboratory testing before feeding if concerns persist."}}
function mockSilage(c){
let score=Math.max(40,Math.min(96,Math.round(94-Math.abs(c.ph-4.2)*20-Math.abs(c.moisture-64)*.6)));
let status=score>=75?"Good":score>=55?"Attention":"High Risk";
return {score,status,metrics:[["pH",c.ph,"Input"],["Moisture",c.moisture+"%","Input"],["Temperature",c.temp+"°C","Input"],["Mould Risk",c.temp>30?"High":c.moisture>70?"Medium":"Medium","AI Predicted"],["Spoilage Risk",score>=75?"Low":"Medium","AI Predicted"],["Fermentation","Good","AI Estimated"]],advisory:"Monitor temperature and inspect sealing conditions regularly. Keep the silage protected from air and visible moisture damage."}}
function resultView(c){
let r=c.result, good=r.status==="Good", att=r.status==="Attention";
return `<div class="section-title"><div><h2>${c.type==="feed"?"🌽 Feed Quality":"🌱 Silage Quality"}</h2><span class="muted">Sample ${esc(c.sampleId)} • ${new Date().toLocaleString()}</span></div></div>
<div class="card"><div class="result-score"><div class="score-ring"><b>${r.score}</b></div><div><div class="muted">QUALITY STATUS</div><h1 style="margin:5px 0">${r.status.toUpperCase()}</h1><span class="badge ${good?"good":att?"attention":"highrisk"}">${good?"● Normal":att?"● Attention":"● High Risk"}</span></div></div>
<div class="metric-grid" style="margin-top:20px">${r.metrics.map(m=>`<div class="metric"><b>${esc(m[1])}</b><span>${esc(m[0])} • ${esc(m[2])}</span></div>`).join("")}</div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h3>👨‍🌾 Farmer Advisory</h3><p style="line-height:1.65;color:var(--muted)">${esc(r.advisory)}</p></div><div class="card"><h3>⚠ Risk interpretation</h3><p style="line-height:1.65;color:var(--muted)">Green = normal, Yellow = attention, Red = high risk. AI-derived indicators depend on the available inputs and model validation.</p></div></div>
<div class="notice" style="margin-top:14px">⚠ <b>Important:</b> AI-estimated/predicted results are for advisory purposes and are not a substitute for certified laboratory testing. The prototype does not claim definitive toxin detection without validated hardware and models.</div>
<div class="actions"><button class="btn green" onclick="saveCurrent()">💾 ${tr("save")}</button><button class="btn outline" onclick="openReport(state.current)">📄 ${tr("download")}</button><button class="btn soft" onclick="state.current=null;nav('${c.type}')">＋ ${tr("another")}</button></div>`}
function saveCurrent(){if(!state.current?.result)return;let item={...state.current,savedAt:new Date().toISOString(),sync:state.online?"Synced":"Pending Sync"};delete item.phase;state.tests.unshift(item);save();toast(state.online?"Result saved & synced":"Result saved locally • Pending Sync");state.current=null;nav("history")}
function openReport(c){$("#reportContent").innerHTML=`<h2>ePASHU Report</h2><p class="muted">Prototype / AI Advisory Report</p><hr><p><b>Farmer:</b> ${esc(state.user.name)}<br><b>Sample:</b> ${esc(c.sampleId)}<br><b>Type:</b> ${esc(c.sampleType)}<br><b>Date:</b> ${new Date().toLocaleString()}</p><h3>Inputs</h3><p>Moisture: ${c.moisture}% • Temperature: ${c.temp}°C • pH: ${c.ph}${c.duration?` • Storage: ${c.duration} days`:""}</p><h3>AI Estimated / Predicted Results</h3><p>Quality Score: <b>${c.result.score}/100</b><br>Status: <b>${esc(c.result.status)}</b></p><ul>${c.result.metrics.map(x=>`<li>${esc(x[0])}: ${esc(x[1])} — ${esc(x[2])}</li>`).join("")}</ul><h3>Advisory</h3><p>${esc(c.result.advisory)}</p><div class="notice">AI-estimated results are advisory only and should not be treated as certified laboratory measurements.</div>`;$("#reportModal").classList.add("show")}
function closeModal(){$("#reportModal").classList.remove("show")}
function printReport(){let w=window.open("","_blank");w.document.write(`<html><head><title>ePASHU Report</title><style>body{font-family:Arial;padding:35px;line-height:1.6}h1,h2{color:#16794a}.note{padding:12px;background:#eef8f0}</style></head><body>${$("#reportContent").innerHTML}</body></html>`);w.document.close();w.print()}
function reportsView(){let latest=state.tests[0];return `<div class="section-title"><div><h2>📄 Reports</h2><span class="muted">Printable prototype reports from saved tests</span></div></div>${latest?`<div class="card"><h3>Latest Report</h3><p class="muted">${esc(latest.sampleId)} • ${esc(latest.sampleType)} • ${new Date(latest.savedAt).toLocaleString()}</p><div class="actions"><button class="btn green" onclick="openReport(${JSON.stringify(latest).replaceAll('"','&quot;')})">📥 Download PDF</button><button class="btn outline" onclick="openReport(${JSON.stringify(latest).replaceAll('"','&quot;')})">🖨 Print</button></div></div>`:`<div class="card empty">No saved tests yet. Complete a feed or silage analysis first.</div>`}<div class="notice" style="margin-top:14px">Reports contain farmer details, sample inputs, AI-estimated results, risk indicators, advisory and the laboratory-testing disclaimer.</div>`}
function historyView(){let ts=state.tests.filter(x=>state.filter==="All"||x.type===state.filter.toLowerCase()||(state.filter==="Good"&&x.result.status==="Good")||(state.filter==="Warning"&&x.result.status==="Attention")||(state.filter==="High Risk"&&x.result.status==="High Risk"));return `<div class="section-title"><div><h2>🕘 ${tr("history")}</h2><span class="muted">Saved tests and future monitoring</span></div><div class="filters">${["All","Feed","Silage","Good","Warning","High Risk"].map(f=>`<button class="${state.filter===f?"on":""}" onclick="state.filter='${f}';render()">${f}</button>`).join("")}</div></div><div class="card table-wrap">${ts.length?`<table class="table"><thead><tr><th>Sample ID</th><th>Date</th><th>Type</th><th>Quality</th><th>Risk</th><th>Sync</th><th>Action</th></tr></thead><tbody>${ts.map(x=>`<tr><td><b>${esc(x.sampleId)}</b></td><td>${new Date(x.savedAt).toLocaleDateString()}</td><td>${esc(x.sampleType)}</td><td><span class="badge ${x.result.status==="Good"?"good":x.result.status==="Attention"?"attention":"highrisk"}>${esc(x.result.status)}</span></td><td>${x.result.status==="Good"?"Low":x.result.status==="Attention"?"Medium":"High"}</td><td>${esc(x.sync||"Synced")}</td><td><button class="btn soft" style="padding:7px 9px" onclick='openReport(${JSON.stringify(x)})'>View</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">🌱<br><b>No tests found</b><br>Saved analyses will appear here.</div>`}</div>`}
function advisoryView(){let cards=[["📦","Feed Storage","Keep feed dry, clean and protected from rain, pests and direct moisture. Use clean storage surfaces."],["🌱","Silage Management","Inspect sealing and temperature regularly. Limit air exposure after opening."],["💧","Moisture Management","Unexpectedly high moisture can increase storage concerns. Confirm questionable samples with appropriate testing."],["🔎","Mould Prevention","Inspect for visible mould, unusual smell or storage damage. Do not rely on an AI prediction alone for safety decisions."],["🧪","Feed Quality","Use the app for screening and advisory support; use certified laboratory testing when confirmation is required."],["🥣","General Nutrition Guidance","Maintain consistent feed practices and consult an agricultural/livestock professional for ration-specific decisions."]];return `<div class="section-title"><div><h2>💡 ${tr("advisory")}</h2><span class="muted">Simple, general guidance — not veterinary diagnosis</span></div></div><div class="grid three">${cards.map(c=>`<div class="card"><div class="advice-icon">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join("")}</div>`}
function profileView(){let u=state.user;return `<div class="section-title"><h2>👤 ${tr("profile")}</h2></div><div class="card"><div class="form-grid">${["name","mobile","village","district","state"].map(k=>`<div class="field"><label>${k[0].toUpperCase()+k.slice(1)}</label><input id="p_${k}" value="${esc(u[k])}"></div>`).join("")}<div class="field"><label>Preferred language</label><select id="p_language"><option value="en" ${state.lang==="en"?"selected":""}>English</option><option value="hi" ${state.lang==="hi"?"selected":""}>Hindi</option></select></div></div><div class="actions"><button class="btn green" onclick="updateProfile()">Save Profile</button><button class="btn danger" onclick="logout()">Logout</button></div></div><div class="notice" style="margin-top:14px">Security note: this prototype keeps demo profile data locally. Production authentication, OTP, tokens and personal data should be handled securely on the backend.</div>`}
function updateProfile(){["name","mobile","village","district","state"].forEach(k=>state.user[k]=$("#p_"+k).value);state.lang=$("#p_language").value;state.user.language=state.lang;save();toast("Profile updated");render()}
function logout(){state.user=null;localStorage.removeItem("fc_user");render()}
function adminView(){let total=state.tests.length||48, good=state.tests.filter(x=>x.result.status==="Good").length||32, att=state.tests.filter(x=>x.result.status==="Attention").length||11, high=state.tests.filter(x=>x.result.status==="High Risk").length||5;return `<div class="section-title"><div><h2>📊 Admin Dashboard</h2><span class="muted">Prototype monitoring view • demo values shown when history is empty</span></div></div><div class="grid stats">${stat(total,"Total Farmers")}${stat(total+17,"Total Tests")}${stat(good,"Good Samples")}${stat(att,"Warning Samples")}${stat(high,"High Risk Samples")}</div><div class="grid two" style="margin-top:14px"><div class="card admin-card"><h3>Tests over time</h3><div class="bars">${[32,48,39,60,53,71,66].map((n,i)=>`<div style="flex:1;text-align:center"><div class="bar" style="height:${n*2}px"></div><div class="legend">D${i+1}</div></div>`).join("")}</div></div><div class="card admin-card"><h3>Quality distribution</h3><div style="display:grid;gap:12px;margin-top:25px">${bar("Good",68,"good")}${bar("Attention",22,"attention")}${bar("High Risk",10,"highrisk")}</div><p class="muted" style="margin-top:22px">Feed and silage distributions are prototype analytics.</p></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>🚨 Recent alerts</h3><ul class="list"><li>High moisture detected in demo sample FC-1025</li><li>Possible mould risk requires review</li><li>Possible adulteration indicator — confirm with laboratory testing</li></ul></div><div class="card"><h3>🗺 Test locations</h3><div class="map"><span class="pin p1">📍</span><span class="pin p2">📍</span><span class="pin p3">📍</span></div><p class="muted">Map placeholder for future geographic monitoring and facility analytics.</p></div></div>`}
function bar(label,p,cl){return `<div><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800"><span>${label}</span><span>${p}%</span></div><div style="height:10px;background:#edf2ee;border-radius:99px;margin-top:5px"><div style="width:${p}%;height:100%;border-radius:99px;background:${cl==="good"?"#2da866":cl==="attention"?"#e6a51b":"#d9534f"}"></div></div></div>`}
function bindPage(){}
window.addEventListener("online",()=>{state.online=true;state.tests=state.tests.map(x=>({...x,sync:"Synced"}));save();render();toast("Back online • local tests synced (demo)")});
window.addEventListener("offline",()=>{state.online=false;render();toast("Offline mode enabled")});
render();
</script>

</html><script>
/* ePASHU feature extension v2
   Adds: spoilage reminders, nutrient quality trends, animal profile + pregnancy-aware advisory,
   voice commands, packet-label photo/OCR demo, personalized advisory, farmer QR identity.
   Production: connect real notification service, validated OCR/ML, and secure backend.
*/
const FC2={
  animal:JSON.parse(localStorage.getItem('fc_animal')||'{"cattle":5,"pregnant":0,"lactating":0,"calves":0,"breed":"Other"}'),
  reminders:JSON.parse(localStorage.getItem('fc_reminders')||'[]'),
  label:null,
  voice:null
};
function saveFC2(){localStorage.setItem('fc_animal',JSON.stringify(FC2.animal));localStorage.setItem('fc_reminders',JSON.stringify(FC2.reminders));save()}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+Number(n||0));return x.toISOString()}
function shelfDays(type,moisture){
  if(type.toLowerCase().includes('silage')) return moisture>70?7:moisture<55?30:21;
  if(moisture>35) return 7; if(moisture>28) return 14; return 30;
}
function reminderStatus(item){let end=new Date(item.useBy), now=new Date(), days=Math.ceil((end-now)/86400000); return {days,status:days<0?'Spoiled/Expired':days<=2?'Use Soon':'Safe Window'}}
function voiceCommand(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice command is not supported in this browser. Try Chrome/Edge.');return}
  const r=new SR(); r.lang=state.lang==='hi'?'hi-IN':'en-IN'; r.interimResults=false; r.maxAlternatives=1; FC2.voice=r;
  toast(state.lang==='hi'?'बोलिए...':'Listening...');
  r.onresult=e=>{let text=e.results[0][0].transcript.toLowerCase();toast('Heard: '+text);handleVoice(text)};
  r.onerror=()=>toast('Voice input could not be captured. Please try again.'); r.start();
}
function handleVoice(t){
 if(/silage|साइलेज/.test(t)){nav('silage');return}
 if(/feed|fodder|चारा|फीड/.test(t)&&/test|जांच|टेस्ट/.test(t)){nav('feed');return}
 if(/history|इतिहास/.test(t)){nav('history');return}
 if(/advice|सलाह|nutrition|पोषण/.test(t)){nav('advisory');return}
 if(/profile|पशु|cattle|जानवर/.test(t)){nav('profile');return}
 if(/report|रिपोर्ट/.test(t)){nav('reports');return}
 toast(state.lang==='hi'?'कमांड समझ नहीं आया।':'Command not recognized. Try “test feed”, “test silage”, “history”, or “advice”.')
}
function speak(text){if(!('speechSynthesis' in window)){toast('Voice playback is not supported here');return} speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=state.lang==='hi'?'hi-IN':'en-IN';speechSynthesis.speak(u)}
function fcShell(content){
 return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">🌿</div>ePASHU</div><div class="top-actions"><button class="pill" onclick="voiceCommand()">🎙 ${state.lang==='hi'?'बोलें':'Voice'}</button><button class="pill" onclick="toggleLang()">🌐 ${state.lang==='en'?'हिन्दी':'English'}</button><span class="pill online">${state.online?'● Online • Synced':'● Offline Mode'}</span><button class="pill userpill" onclick="nav('profile')">👤 ${esc(state.user?.name||'Farmer')}</button></div></header><div class="layout"><aside class="sidebar"><nav class="nav">${navBtn('home','🏠',tr('home'))}${navBtn('feed','🌽',tr('feed'))}${navBtn('silage','🌱',tr('silage'))}${navBtn('reports','📄',tr('reports'))}${navBtn('advisory','💡',tr('advisory'))}${navBtn('history','🕘',tr('history'))}${navBtn('profile','👤',tr('profile'))}<button onclick="nav('admin')">📊 Admin Dashboard</button></nav><div class="side-note"><b>${state.online?'🟢 Online • Synced':'🟠 Offline Mode'}</b><br>Voice, reminders, nutrient trends and farmer QR are available in this prototype.</div></aside><main class="main">${content}</main></div><nav class="mobile-nav">${navBtnMobile('home','🏠',tr('home'))}${navBtnMobile('feed','🌽',tr('feed'))}${navBtnMobile('silage','🌱',tr('silage'))}${navBtnMobile('history','🕘',tr('history'))}${navBtnMobile('profile','👤',tr('profile'))}</nav></div>`
}
shell=fcShell;
function homeView(){
 let active=state.tests.filter(x=>x.useBy); let urgent=active.map(x=>({...x,...reminderStatus(x)})).filter(x=>x.days<=3).sort((a,b)=>a.days-b.days);
 return `<section class="hero"><div class="demo">SIH PROTOTYPE • AI ESTIMATED VALUES</div><h1>${tr('hero')}</h1><p>${tr('sub')}</p><div class="actions"><button class="btn primary" onclick="nav('feed')">🌽 ${tr('testFeed')}</button><button class="btn primary" onclick="nav('silage')">🌱 ${tr('testSilage')}</button><button class="btn primary" onclick="voiceCommand()">🎙 Voice Command</button></div></section>
 <div class="section-title"><h2>⚠ Feed & Silage Early-Warning System</h2><span class="muted">Local reminder demo</span></div><div class="grid two">${urgent.length?urgent.slice(0,4).map(x=>`<div class="card"><div class="risk"><span class="dot ${x.days<0?'high':x.days<=2?'med':'low'}"></span>${esc(x.sampleType)} — ${x.days<0?'Use-by date passed':x.days===0?'Use today':'Use within '+x.days+' day(s)'}</div><p class="muted" style="margin-top:8px">Sample ${esc(x.sampleId)} • Use by ${new Date(x.useBy).toLocaleDateString()}</p><button class="btn soft" style="margin-top:10px" onclick='openReport(${JSON.stringify(x)})'>View Test</button></div>`).join(''):`<div class="card"><b>✅ No urgent warnings</b><p class="muted">When you save a test, FeedCare AI estimates a recommended use-by window and reminds you before the sample should be rechecked or discarded.</p></div>`}<div class="card"><h3>🔔 Reminder</h3><p class="muted">Enable browser notifications to receive future reminders. This prototype also keeps reminders locally when offline.</p><button class="btn outline" onclick="enableNotifications()">Enable Notifications</button></div></div>
 <div class="section-title"><h2>📈 Feed Quality History</h2><span class="muted">AI-estimated nutrient trend from saved tests</span></div><div class="card">${trendHtml()}</div>
 <div class="section-title"><h2>👨‍🌾 Personalized Feed Advisory</h2></div><div class="card"><p>${personalizedAdvice()}</p><button class="btn soft" onclick="nav('profile')">Update Animal Profile</button><button class="btn outline" style="margin-left:7px" onclick="speak(${JSON.stringify(personalizedAdvice())})">🔊 Hear Advice</button></div>
 <div class="section-title"><h2>⚡ Quick Features</h2></div><div class="grid features">${feature('🤖',tr('ai'),'Analyze available image and sensor inputs with a modular AI/ML layer.')}${feature('📡',tr('portable'),'Portable testing, camera input and demo sensor data.')}${feature('🧾','Packet Nutrition Scan','Photograph the nutrition facts on the back of a fodder packet and use the values for advisory input.')}</div>`
}
function enableNotifications(){if(!('Notification' in window)){toast('Notifications are not supported');return}Notification.requestPermission().then(p=>toast(p==='granted'?'Notifications enabled':'Notification permission not granted'))}
function trendHtml(){let ts=state.tests.filter(x=>x.result&&x.type==='feed').slice(0,8).reverse();if(!ts.length)return `<div class="empty">No feed history yet.<br>Complete and save multiple feed tests to see whether estimated protein, fiber and quality are increasing or decreasing.</div>`;let latest=ts[ts.length-1], prev=ts.length>1?ts[ts.length-2]:null;let val=x=>parseFloat((x.result.metrics.find(m=>m[0]==='Protein')||['','0'])[1]);let diff=prev?val(latest)-val(prev):0;return `<div class="grid three"><div class="metric"><b>${val(latest)}%</b><span>Latest AI Estimated Protein</span></div><div class="metric"><b>${prev?(diff>0?'↗ Increasing':diff<0?'↘ Decreasing':'→ Stable'):'—'}</b><span>Protein trend vs previous test</span></div><div class="metric"><b>${latest.result.score}/100</b><span>Latest quality score</span></div></div><div style="margin-top:15px"><b>Trend interpretation</b><p class="muted">FeedCare compares saved AI-estimated nutrient values over time. A trend is not a laboratory conclusion; use certified testing when a meaningful change needs confirmation.</p></div>`}
function personalizedAdvice(){let a=FC2.animal;let s=`Based on the entered animal profile and available feed measurements, consider discussing the ration with a qualified livestock nutritionist.`;if(Number(a.pregnant)>0)s+=` For ${a.pregnant} pregnant animal(s), nutrition needs can change during pregnancy. Maintain appropriate energy, protein, minerals and clean water, and discuss the ration with a qualified livestock nutritionist rather than changing supplements based only on this prototype.`;if(Number(a.lactating)>0)s+=` For ${a.lactating} lactating animal(s), adequate energy, protein, minerals and water are important for production; use professional ration guidance for exact quantities.`;return s}
function testView(type){let isFeed=type==='feed',c=state.current;if(c&&c.type===type&&c.phase==='result')return resultView(c);return `<div class="section-title"><div><h2>${isFeed?'🌽 '+tr('feed'):'🌱 '+tr('silage')}</h2><span class="muted">Guided quality assessment with early warning and packet-label support</span></div></div><div class="stepper"><span class="on">1. Sample</span><span class="on">2. Input</span><span>3. Analysis</span><span>4. Result</span></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>① ${isFeed?'Feed':'Silage'} details</h3><div class="form-grid"><div class="field"><label>${isFeed?'Feed':'Silage'} type</label><select id="sampleType">${(isFeed?['Maize','Wheat','Cattle Feed','Fodder','Other']:['Maize Silage','Grass Silage','Mixed Silage','Other']).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Sample ID</label><input id="sampleId" value="${makeId()}" readonly></div><div class="field"><label>Moisture (%)</label><input id="moisture" type="number" min="0" max="100" value="${isFeed?28:64}"></div><div class="field"><label>Temperature (°C)</label><input id="temp" type="number" value="27"></div><div class="field"><label>pH</label><input id="ph" type="number" step=".1" value="${isFeed?6:4.2}"></div>${!isFeed?`<div class="field"><label>Storage duration (days)</label><input id="duration" type="number" value="21"></div>`:''}</div></div><div class="card"><h3>② Sample image / Camera</h3><div class="upload"><div style="font-size:30px">📷</div><b>Upload, take sample photo, or scan packet label</b><p class="muted">Use the camera for fodder appearance or the back-side nutrition facts.</p><input id="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" onchange="previewImage(event)"><div class="actions" style="justify-content:center"><button class="btn soft" onclick="openCamera()">📸 Take Photo</button><button class="btn outline" onclick="openLabelCamera()">🧾 Scan Packet Nutrition</button></div><img id="preview" class="preview"></div><div id="labelBox" style="margin-top:10px"></div></div></div><div class="card" style="margin-top:14px"><h3>③ ${tr('connect')}</h3><p class="muted">Bluetooth/device integration point. For prototype use, values can be entered manually.</p><div class="actions"><button class="btn soft" onclick="connectDevice()">📡 ${state.connected?'Device Connected':'Connect Demo Device'}</button><span class="pill">${state.connected?'🟢 Connected':'⚪ Not connected'}</span></div><div class="notice" style="margin-top:12px">⚠ <b>Demo Sensor Input:</b> manually entered values are simulated/prototype inputs, not certified laboratory measurements.</div><div class="actions"><button class="btn green" onclick="startAnalysis('${type}')">⚡ ${tr('start')}</button></div></div>`}
function resultView(c){let r=c.result,good=r.status==='Good',att=r.status==='Attention';return `<div class="section-title"><div><h2>${c.type==='feed'?'🌽 Feed Quality':'🌱 Silage Quality'}</h2><span class="muted">Sample ${esc(c.sampleId)} • ${new Date().toLocaleString()}</span></div></div><div class="card"><div class="result-score"><div class="score-ring"><b>${r.score}</b></div><div><div class="muted">QUALITY STATUS</div><h1 style="margin:5px 0">${r.status.toUpperCase()}</h1><span class="badge ${good?'good':att?'attention':'highrisk'}">${good?'● Normal':att?'● Attention':'● High Risk'}</span></div></div><div class="metric-grid" style="margin-top:20px">${r.metrics.map(m=>`<div class="metric"><b>${esc(m[1])}</b><span>${esc(m[0])} • ${esc(m[2])}</span></div>`).join('')}</div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>👨‍🌾 Personalized Advisory</h3><p style="line-height:1.65;color:var(--muted)">${esc(personalizedAdvice())}</p><button class="btn soft" onclick="speak(${JSON.stringify(personalizedAdvice())})">🔊 Hear Advice</button></div><div class="card"><h3>⏰ Early-Warning Reminder</h3><p class="muted">Estimated recommended use window based on sample type and entered moisture.</p><div class="notice success"><b>Use by:</b> ${new Date(c.useBy||addDays(c.createdAt||new Date(),shelfDays(c.sampleType,c.moisture))).toLocaleDateString()}</div></div></div><div class="notice" style="margin-top:14px">⚠ <b>Important:</b> AI-estimated/predicted results are for advisory purposes and are not a substitute for certified laboratory testing. The prototype does not claim definitive toxin detection without validated hardware and models.</div><div class="actions"><button class="btn green" onclick="saveCurrent()">💾 ${tr('save')}</button><button class="btn outline" onclick="openReport(state.current)">📄 ${tr('download')}</button><button class="btn soft" onclick="state.current=null;nav('${c.type}')">＋ ${tr('another')}</button></div>`}
function startAnalysis(type){let moisture=Number($('#moisture').value),temp=Number($('#temp').value),ph=Number($('#ph').value);if(!Number.isFinite(moisture)||moisture<0||moisture>100)return toast('Enter a valid moisture value');state.current={type,phase:'loading',sampleId:$('#sampleId').value,sampleType:$('#sampleType').value,moisture,temp,ph,duration:Number($('#duration')?.value||0),image:$('#preview')?.src||null,label:FC2.label,createdAt:new Date().toISOString()};render();setTimeout(()=>{state.current={...state.current,phase:'result',result:type==='feed'?mockFeed(state.current):mockSilage(state.current)};state.current.useBy=addDays(state.current.createdAt,shelfDays(state.current.sampleType,state.current.moisture));render()},1600)}
function saveCurrent(){if(!state.current?.result)return;let item={...state.current,savedAt:new Date().toISOString(),sync:state.online?'Synced':'Pending Sync'};delete item.phase;state.tests.unshift(item);saveFC2();toast(state.online?'Result saved & synced':'Result saved locally • Pending Sync');maybeNotify(item);state.current=null;nav('history')}
function maybeNotify(item){if('Notification' in window&&Notification.permission==='granted')new Notification('ePASHU Reminder',{body:`${item.sampleType} ${item.sampleId} is estimated for use until ${new Date(item.useBy).toLocaleDateString()}.`})}
function profileView(){let u=state.user,a=FC2.animal;return `<div class="section-title"><h2>👤 ${tr('profile')}</h2></div><div class="grid two"><div class="card"><h3>Farmer Profile</h3><div class="form-grid">${['name','mobile','village','district','state'].map(k=>`<div class="field"><label>${k[0].toUpperCase()+k.slice(1)}</label><input id="p_${k}" value="${esc(u[k])}"></div>`).join('')}<div class="field"><label>Preferred language</label><select id="p_language"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="hi" ${state.lang==='hi'?'selected':''}>Hindi</option></select></div></div><div class="actions"><button class="btn green" onclick="updateProfile()">Save Profile</button><button class="btn danger" onclick="logout()">Logout</button></div></div><div class="card"><h3>🐄 Animal Profile</h3><div class="form-grid"><div class="field"><label>Total cattle</label><input id="a_cattle" type="number" min="0" value="${a.cattle}"></div><div class="field"><label>Pregnant cattle</label><input id="a_pregnant" type="number" min="0" value="${a.pregnant}"></div><div class="field"><label>Lactating cattle</label><input id="a_lactating" type="number" min="0" value="${a.lactating}"></div><div class="field"><label>Calves</label><input id="a_calves" type="number" min="0" value="${a.calves}"></div><div class="field"><label>Breed</label><select id="a_breed"><option ${a.breed==='Other'?'selected':''}>Other</option><option ${a.breed==='Sahiwal'?'selected':''}>Sahiwal</option><option ${a.breed==='Gir'?'selected':''}>Gir</option><option ${a.breed==='Jersey'?'selected':''}>Jersey</option><option ${a.breed==='Holstein Friesian'?'selected':''}>Holstein Friesian</option></select></div></div><div class="actions"><button class="btn green" onclick="saveAnimal()">Save Animal Profile</button></div><div class="notice" style="margin-top:10px">Pregnancy-aware guidance is general only. Exact ration changes should be discussed with a qualified livestock nutritionist.</div></div></div><div class="section-title"><h2>🔳 Your Farmer QR</h2></div><div class="card qr-card"><div id="farmerQR" style="text-align:center;padding:12px"></div><div><h3>Unique Farmer Identity</h3><p class="muted">The QR payload contains your demo farmer ID, cattle count, pregnant count and location profile. Production should use a secure backend-issued identifier rather than exposing sensitive personal data.</p><button class="btn soft" onclick="generateFarmerQR()">Generate / Refresh QR</button></div></div><div class="section-title"><h2>🗣 Voice Command</h2></div><div class="card"><p class="muted">Try commands such as “test feed”, “test silage”, “show history”, “show advisory”, or “show profile”.</p><button class="btn green" onclick="voiceCommand()">🎙 Start Voice Command</button></div>`}
function saveAnimal(){FC2.animal={cattle:Number($('#a_cattle').value||0),pregnant:Number($('#a_pregnant').value||0),lactating:Number($('#a_lactating').value||0),calves:Number($('#a_calves').value||0),breed:$('#a_breed').value};saveFC2();toast('Animal profile saved');render()}
function generateFarmerQR(){let payload={id:'FC-FARMER-'+String(state.user.mobile||'DEMO').slice(-4),cattle:FC2.animal.cattle,pregnant:FC2.animal.pregnant,lactating:FC2.animal.lactating,village:state.user.village,district:state.user.district};let data=encodeURIComponent(JSON.stringify(payload));let box=$('#farmerQR');box.innerHTML=`<img alt="Farmer QR" style="width:220px;height:220px;border-radius:10px;border:10px solid white;box-shadow:0 5px 20px #dfe9e3" src="/qr?data=${data}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="qr-fallback">QR<br><small>${esc(payload.id)}</small></div><p class="muted">ID: ${esc(payload.id)}</p>`}
function openLabelCamera(){let box=$('#labelBox');box.innerHTML=`<div class="card" style="margin-top:8px"><b>🧾 Packet Nutrition Facts</b><p class="muted">Capture the back of the fodder packet. This prototype simulates OCR; verify every value against the printed label.</p><input id="labelImage" type="file" accept="image/*" capture="environment" onchange="scanLabel(event)"><div class="form-grid" style="margin-top:10px"><div class="field"><label>Protein (%)</label><input id="labelProtein" type="number" step=".1" placeholder="e.g. 16"></div><div class="field"><label>Fiber (%)</label><input id="labelFiber" type="number" step=".1" placeholder="e.g. 18"></div><div class="field"><label>Fat (%)</label><input id="labelFat" type="number" step=".1" placeholder="e.g. 4"></div><div class="field"><label>Moisture (%)</label><input id="labelMoisture" type="number" step=".1" placeholder="e.g. 12"></div></div><button class="btn soft" style="margin-top:10px" onclick="useLabelFacts()">Use Label Facts for Advisory</button></div>`}
function scanLabel(e){if(!e.target.files[0])return;toast('Packet photo captured. Demo OCR ready.');$('#labelProtein').value=16;$('#labelFiber').value=18;$('#labelFat').value=4;$('#labelMoisture').value=12;}
function useLabelFacts(){FC2.label={protein:Number($('#labelProtein').value||0),fiber:Number($('#labelFiber').value||0),fat:Number($('#labelFat').value||0),moisture:Number($('#labelMoisture').value||0)};toast('Nutrition facts added to advisory input (demo OCR)');}
function historyView(){let ts=state.tests.filter(x=>state.filter==='All'||x.type===state.filter.toLowerCase()||(state.filter==='Good'&&x.result.status==='Good')||(state.filter==='Warning'&&x.result.status==='Attention')||(state.filter==='High Risk'&&x.result.status==='High Risk'));return `<div class="section-title"><div><h2>🕘 ${tr('history')}</h2><span class="muted">Past tests, early warnings and nutrient quality trends</span></div><div class="filters">${['All','Feed','Silage','Good','Warning','High Risk'].map(f=>`<button class="${state.filter===f?'on':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div></div><div class="card table-wrap">${ts.length?`<table class="table"><thead><tr><th>Sample ID</th><th>Date</th><th>Type</th><th>Quality</th><th>Protein</th><th>Use By</th><th>Action</th></tr></thead><tbody>${ts.map(x=>`<tr><td><b>${esc(x.sampleId)}</b></td><td>${new Date(x.savedAt).toLocaleDateString()}</td><td>${esc(x.sampleType)}</td><td><span class="badge ${x.result.status==='Good'?'good':x.result.status==='Attention'?'attention':'highrisk'}">${esc(x.result.status)}</span></td><td>${esc((x.result.metrics.find(m=>m[0]==='Protein')||['','—'])[1])}</td><td>${x.useBy?new Date(x.useBy).toLocaleDateString():'—'}</td><td><button class="btn soft" style="padding:7px 9px" onclick='openReport(${JSON.stringify(x)})'>View</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">🌱<br><b>No tests found</b><br>Saved analyses will appear here.</div>`}</div><div class="section-title"><h2>📈 Nutrient Quality Trend</h2></div><div class="card">${trendHtml()}</div>`}
/* Camera modal used by the earlier camera feature; retained and hardened. */
function openCamera(){if(document.getElementById('cameraModal'))return;document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="cameraModal"><div class="modal-box"><button class="close" onclick="closeCamera()">×</button><h3>📸 Take Sample Photo</h3><video id="cameraVideo" autoplay playsinline style="width:100%;border-radius:16px;background:#101713;max-height:55vh"></video><canvas id="cameraCanvas" style="display:none"></canvas><div class="actions"><button class="btn green" onclick="capturePhoto()">⏺ Capture</button><button class="btn outline" onclick="closeCamera()">Close</button></div><p class="muted">Allow camera permission when your browser asks.</p></div></div>`);navigator.mediaDevices?.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>{window.fcStream=s;$('#cameraVideo').srcObject=s}).catch(()=>{toast('Camera permission denied or camera unavailable');closeCamera()})}
function capturePhoto(){let v=$('#cameraVideo'),c=$('#cameraCanvas');if(!v||!v.videoWidth)return toast('Camera is not ready');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg',.88);let p=$('#preview');if(p){p.src=url;p.style.display='block'}closeCamera();toast('Sample photo captured')}
function closeCamera(){window.fcStream?.getTracks().forEach(t=>t.stop());window.fcStream=null;document.getElementById('cameraModal')?.remove()}
function updateProfile(){['name','mobile','village','district','state'].forEach(k=>state.user[k]=$('#p_'+k).value);state.lang=$('#p_language').value;state.user.language=state.lang;save();toast('Profile updated');render()}
function render(){if(!state.user){renderAuth();return}document.getElementById('root').innerHTML=fcShell(viewContent());if(state.view==='profile')setTimeout(generateFarmerQR,50)}
render();
</script>
